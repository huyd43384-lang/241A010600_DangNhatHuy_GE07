
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản lý tài chính cá nhân</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 25px;
            background: #f1f5f9;
            color: #1e293b;
        }

        .container {
            max-width: 1100px;
            margin: auto;
        }

        h1 {
            color: #1d4ed8;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #64748b;
            margin-bottom: 25px;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 3px 10px #00000010;
        }

        .card h3 {
            margin-top: 0;
            color: #64748b;
            font-size: 16px;
        }

        .amount {
            font-size: 25px;
            font-weight: bold;
        }

        .income {
            color: #16a34a;
        }

        .expense {
            color: #dc2626;
        }

        .balance {
            color: #2563eb;
        }

        .history {
            background: white;
            padding: 25px;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow: 0 3px 10px #00000010;
        }

        .history h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
        }

        th {
            background: #eff6ff;
            color: #1d4ed8;
        }

        .type-income {
            color: #16a34a;
            font-weight: bold;
        }

        .type-expense {
            color: #dc2626;
            font-weight: bold;
        }

        @media (max-width: 700px) {
            body {
                padding: 15px;
            }

            .cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>📊 Tổng quan tài chính</h1>
        <p class="subtitle">
            Theo dõi thu nhập, chi tiêu và số dư cá nhân
        </p>

        <div class="cards">
            <div class="card">
                <h3>💰 Tổng thu</h3>
                <div class="amount income" id="totalIncome">
                    0 ₫
                </div>
            </div>

            <div class="card">
                <h3>💸 Tổng chi</h3>
                <div class="amount expense" id="totalExpense">
                    0 ₫
                </div>
            </div>

            <div class="card">
                <h3>🏦 Số dư hiện tại</h3>
                <div class="amount balance" id="balance">
                    0 ₫
                </div>
            </div>
        </div>

        <div class="history">
            <h2>📋 Lịch sử giao dịch</h2>

            <table>
                <thead>
                    <tr>
                        <th>Ngày</th>
                        <th>Nội dung</th>
                        <th>Loại giao dịch</th>
                        <th>Số tiền</th>
                    </tr>
                </thead>

                <tbody id="transactionList"></tbody>
            </table>
        </div>
    </div>

    <script>
        const transactions = [
            {
                date: "01/10/2026",
                description: "Tiền sinh hoạt gia đình",
                type: "Thu",
                amount: 5000000
            },
            {
                date: "03/10/2026",
                description: "Tiền ăn uống",
                type: "Chi",
                amount: 500000
            },
            {
                date: "05/10/2026",
                description: "Làm thêm",
                type: "Thu",
                amount: 2000000
            },
            {
                date: "07/10/2026",
                description: "Mua sách học tập",
                type: "Chi",
                amount: 300000
            },
            {
                date: "10/10/2026",
                description: "Tiền đi lại",
                type: "Chi",
                amount: 200000
            }
        ];

        let totalIncome = 0;
        let totalExpense = 0;

        const formatMoney = amount =>
            amount.toLocaleString("vi-VN") + " ₫";

        const transactionList =
            document.getElementById("transactionList");

        transactions.forEach(transaction => {
            const row = document.createElement("tr");

            if (transaction.type === "Thu") {
                totalIncome += transaction.amount;
            } else {
                totalExpense += transaction.amount;
            }

            row.innerHTML = `
                <td>${transaction.date}</td>
                <td>${transaction.description}</td>
                <td class="${transaction.type === "Thu"
                    ? "type-income" : "type-expense"}">
                    ${transaction.type}
                </td>
                <td class="${transaction.type === "Thu"
                    ? "type-income" : "type-expense"}">
                    ${transaction.type === "Thu" ? "+" : "-"}
                    ${formatMoney(transaction.amount)}
                </td>
            `;

            transactionList.appendChild(row);
        });

        document.getElementById("totalIncome").textContent =
            formatMoney(totalIncome);

        document.getElementById("totalExpense").textContent =
            formatMoney(totalExpense);

        document.getElementById("balance").textContent =
            formatMoney(totalIncome - totalExpense);
            // BÀI 4: BẢO MẬT DỮ LIỆU ĐẦU VÀO

function escapeHTML(str) {
    const entities = {
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
    };

    return String(str).replace(/[&<>"']/g, function (char) {
        return entities[char];
    });
}

// Kiểm tra dữ liệu giao dịch
function validateTransaction(type, amount, category, date) {
    if (!type || !category || !date || amount === "") {
        alert("Vui lòng nhập đầy đủ thông tin!");
        return false;
    }

    if (type !== "Thu" && type !== "Chi") {
        alert("Loại giao dịch không hợp lệ!");
        return false;
    }

    if (!Number.isFinite(Number(amount)) || Number(amount) <= 0) {
        alert("Số tiền phải lớn hơn 0!");
        return false;
    }

    return true;
}
    </script>
</body>
</html>
